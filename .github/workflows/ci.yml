name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Fails the build: runtime dependencies are shipped to users.
      - name: Audit production dependencies
        run: yarn audit --groups dependencies --level moderate

      # Informational: dev tooling is not shipped, so it does not fail the build.
      - name: Audit all dependencies (informational)
        run: yarn audit --level high || true

  outdated:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Informational: `yarn outdated` exits non-zero when anything is outdated.
      - name: Check for outdated packages
        run: yarn outdated || true
